<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header class="app-header">
    <h1>QuickNotes</h1>
    <p>Your simple personal note-taking app.</p>
</header>

<main class="app-main">
    <section>
    <h2>Your Notes</h2>

    <input
        type="text"
        id="search-input"
        placeholder="Search your notes..."
    >
    <ul id="notes-list"></ul>

    <p id="note-count">You have 0 notes.</p>

    <p id="error-message"></p>
</section>
        <form id="note-form">
    <label for="note-input">Write your note:</label>
    <textarea id="note-input" placeholder="Type your note here..."></textarea>

    <label for="note-category">Choose a category:</label>
    <select id="note-category">
        <option value="personal">Personal</option>
        <option value="work">Work</option>
        <option value="study">Study</option>
    </select>

    <button type="submit">Add Note</button>
</form>
    </section>

    <section>
        <h2>Your Notes</h2>
    </section>
</main>

<footer>
    <p>QuickNotes App &copy; 2026</p>
</footer>
</body>
</html>
